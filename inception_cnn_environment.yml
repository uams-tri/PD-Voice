# Conda environment for the Inception-based voice spectrogram classification notebook.
#
# Create with:
#   conda env create -f inception_cnn_environment.yml
#   conda activate inception_cnn_environment
#   python -m ipykernel install --user --name inception_cnn_environment --display-name "Python (inception_cnn_environment)"

name: inception_cnn_environment

channels:
  - conda-forge
  - defaults

dependencies:
  # Python 3.10 is a conservative choice for TensorFlow/Keras 2.15 compatibility,
  # including Windows, macOS, and Linux CPU installs.
  - python=3.10
  - pip>=23

  # Core scientific stack used by the notebook.
  # NumPy is capped below 2.0 because TensorFlow 2.15.x requires NumPy 1.x.
  - numpy>=1.23,<2.0
  - pandas>=1.5,<3.0
  - scipy>=1.9,<2.0
  - scikit-learn>=1.2,<1.6
  - matplotlib>=3.7,<3.10

  # Image I/O and model persistence support.
  - pillow>=9.0,<11.0
  - h5py>=3.8,<4.0

  # Jupyter/Notebook support.
  - jupyterlab>=4.0,<5.0
  - notebook>=7.0,<8.0
  - ipykernel>=6.0,<7.0
  - ipywidgets>=8.0,<9.0
  - tqdm>=4.0,<5.0

  # TensorFlow is installed with pip because this is usually more reliable
  # cross-platform than Conda TensorFlow packages, especially on Windows.
  - pip:
      - tensorflow==2.15.1
      - keras==2.15.0
